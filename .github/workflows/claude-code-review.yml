name: Claude Code Review

# Runs an automated Claude code review whenever a PR is opened, marked ready
# for review, reopened, or gets new commits (synchronize). A newer push
# cancels the review still running for the previous one. Bills the Claude
# subscription via the CLAUDE_CODE_OAUTH_TOKEN repo secret (created with `claude setup-token`).
on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true

concurrency:
  group: claude-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts and PRs from forks (secrets aren't available to them).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}

            Review this pull request. Read the diff with `gh pr diff` and
            `gh pr view`, and open the surrounding code where you need context.

            This may be a re-review after new commits. Check your earlier
            review comments with `gh pr view --comments`: say which earlier
            findings are now fixed, keep the ones still present, and focus
            on what changed since then. Don't repeat fixed findings.

            Focus on, in order:
            1. Correctness bugs and regressions (logic errors, edge cases,
               broken invariants, unhandled errors, concurrency issues).
            2. Security problems.
            3. Missing or inadequate tests for changed behaviour.
            4. Performance problems that matter in practice.
            Skip pure style nitpicks unless they hide a real problem.

            Post exactly one comment, a summary, with `gh pr comment`: an
            overall verdict, then the findings by severity, each with its
            `path:line` and what to change. Do not post inline comments.
            If you find nothing worth flagging, say so briefly.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
