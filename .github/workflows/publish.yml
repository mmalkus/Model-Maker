name: Publish (PyPI, then the VS Code extension)

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Check the built distributions
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      # The wheel ships the demo projects and the data generator (no data
      # files) -- check a clean install can actually set the demo up.
      - name: Check the demo works from the built wheel
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          modelmaker-demo demo
          cd demo
          # A real file with a __main__ guard, not `python -` on stdin: block
          # runs spawn subprocesses that re-import the main module by path,
          # and there is no file to import for <stdin>.
          cat > check_demo.py <<'EOF'
          from pathlib import Path

          import modelmaker.api  # registers every block, as the server does
          from modelmaker.session import ProjectSession

          if __name__ == "__main__":
              session = ProjectSession(recovery_path=None)
              session.load(Path("projects/demo_pd_model/model.json"))
              session.runner.run_all()
              not_green = [b.name for bid, b in session.graph.blocks.items() if session.runner.status(bid) != "green"]
              assert not not_green, f"demo blocks not green: {not_green}"
              print("demo pipeline ran green from the installed wheel")
          EOF
          python check_demo.py

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/quantology-modelmaker
    permissions:
      id-token: write # required for PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  # The VS Code extension installs the package from PyPI, so it publishes
  # after it (vscode-extension-plan.md §8).
  build-vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check versions (package, extension, release tag)
        run: |
          py=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          ext=$(node -p "require('./vscode/package.json').version")
          test "$py" = "$ext" || { echo "pyproject.toml is $py but vscode/package.json is $ext"; exit 1; }
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
            test "${tag#v}" = "$ext" || { echo "release tag $tag doesn't match version $ext"; exit 1; }
          fi

      # Marketplace convention: odd minor versions are pre-releases.
      - name: Pick the release channel
        id: channel
        run: |
          minor=$(node -p "require('./vscode/package.json').version.split('.')[1]")
          echo "pre-release=$([ $((minor % 2)) -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - run: npm ci
        working-directory: frontend
      - run: npm run build:vscode
        working-directory: frontend
      - run: npm ci
        working-directory: vscode

      - name: Package the .vsix
        working-directory: vscode
        run: npx vsce package --no-dependencies ${{ steps.channel.outputs.pre-release == 'true' && '--pre-release' || '' }} -o modelmaker.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vscode/modelmaker.vsix

  publish-vscode:
    needs: [publish, build-vscode]
    runs-on: ubuntu-latest
    environment:
      name: vscode-marketplace
      url: https://marketplace.visualstudio.com/items?itemName=quantology.modelmaker
    permissions:
      contents: write # attach the .vsix to the GitHub release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The .vsix already carries the pre-release flag (vsce package
      # --pre-release above); both marketplaces read it from there.
      - name: Publish to the Visual Studio Marketplace
        run: npx --yes @vscode/vsce publish --packagePath modelmaker.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        run: npx --yes ovsx publish modelmaker.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      # For machines that can't reach either marketplace:
      # code --install-extension modelmaker.vsix
      - name: Attach the .vsix to the release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" modelmaker.vsix --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
