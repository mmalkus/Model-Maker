name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a PR supersedes the run for its previous commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported and newest classified version.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Editable, so setup.py skips the frontend build (the frontend job
      # covers that) -- every extra the tests exercise.
      - name: Install
        run: python -m pip install -e ".[dev,anthropic,tui,excel,db]"

      # Parallel across the runner's cores (pytest-xdist): most of the
      # suite's time is block runs waiting on freshly spawned worker
      # processes, not CPU, so this is close to a linear speedup.
      - name: Run tests
        run: python -m pytest -q -n auto

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      # tsc -b && vite build. setup.py swallows a failed frontend build when
      # packaging, so this is the only place a broken one fails loudly.
      - run: npm run build
      # The VS Code webview build must leave the Python package's bundle
      # alone (vscode-extension-plan.md §2, invariant 2).
      - name: Build for VS Code without touching modelmaker/static
        run: |
          (cd ../modelmaker/static && find . -type f | sort | xargs sha256sum) > "$RUNNER_TEMP/static.before"
          npm run build:vscode
          (cd ../modelmaker/static && find . -type f | sort | xargs sha256sum) > "$RUNNER_TEMP/static.after"
          diff "$RUNNER_TEMP/static.before" "$RUNNER_TEMP/static.after"
          test -f ../vscode/media/webview/index.html

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            vscode/package-lock.json

      # Released in lockstep (vscode-extension-plan.md §8.2).
      - name: Check the extension's version matches the package's
        run: |
          py=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          ext=$(node -p "require('./vscode/package.json').version")
          test "$py" = "$ext" || { echo "pyproject.toml is $py but vscode/package.json is $ext"; exit 1; }

      - name: Install the Python package (the backend the tests start)
        run: python -m pip install -e .

      - run: npm ci
        working-directory: frontend
      - run: npm run build:vscode
        working-directory: frontend

      - run: npm ci
        working-directory: vscode
      - run: npm run lint
        working-directory: vscode
      - run: npm run typecheck
        working-directory: vscode
      # Includes the chat tools against a real backend (the package above).
      - run: MODELMAKER_TEST_PYTHON="$(command -v python)" npm run test:unit
        working-directory: vscode

      - name: Package the .vsix
        working-directory: vscode
        run: npx vsce package --no-dependencies -o modelmaker.vsix

      # A real VS Code opening the demo project: backend start with auth,
      # project load, a green run, save. Copilot isn't signed in here.
      - name: Integration tests
        working-directory: vscode
        run: |
          ws="$RUNNER_TEMP/workspace"
          mkdir -p "$ws/.vscode"
          (cd "$ws" && modelmaker-demo .)
          printf '{"modelmaker.pythonPath": "%s", "modelmaker.autoInstall": "never"}\n' "$(command -v python)" > "$ws/.vscode/settings.json"
          MODELMAKER_TEST_WORKSPACE="$ws" xvfb-run -a npm test

      - uses: actions/upload-artifact@v4
        with:
          name: modelmaker-vsix
          path: vscode/modelmaker.vsix

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*

      # Same check publish.yml makes before a release, so a PR can't break it.
      - name: Check the demo works from the built wheel
        run: |
          python -m pip install dist/*.whl
          # Out of the checkout, so `import modelmaker` is the installed wheel.
          cd "$RUNNER_TEMP"
          test -f "$(python -c 'import modelmaker, pathlib; print(pathlib.Path(modelmaker.__file__).parent)')/static/index.html"
          modelmaker-demo demo
          test -f demo/projects/demo_pd_model/model.json
          cd demo
          # A real file with a __main__ guard, not `python -` on stdin: block
          # runs spawn subprocesses that re-import the main module by path,
          # and there is no file to import for <stdin>.
          cat > check_demo.py <<'EOF'
          from pathlib import Path

          import modelmaker.api  # registers every block, as the server does
          from modelmaker.session import ProjectSession

          if __name__ == "__main__":
              session = ProjectSession(recovery_path=None)
              session.load(Path("projects/demo_pd_model/model.json"))
              session.runner.run_all()
              not_green = [b.name for bid, b in session.graph.blocks.items() if session.runner.status(bid) != "green"]
              assert not not_green, f"demo blocks not green: {not_green}"
              print("demo pipeline ran green from the installed wheel")
          EOF
          python check_demo.py
