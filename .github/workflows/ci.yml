name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a PR supersedes the run for its previous commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported and newest classified version.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Editable, so setup.py skips the frontend build (the frontend job
      # covers that) -- every extra the tests exercise.
      - name: Install
        run: python -m pip install -e ".[dev,anthropic,tui,excel,db]"

      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      # tsc -b && vite build. setup.py swallows a failed frontend build when
      # packaging, so this is the only place a broken one fails loudly.
      - run: npm run build

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*

      # Same check publish.yml makes before a release, so a PR can't break it.
      - name: Check the demo works from the built wheel
        run: |
          python -m pip install dist/*.whl
          # Out of the checkout, so `import modelmaker` is the installed wheel.
          cd "$RUNNER_TEMP"
          test -f "$(python -c 'import modelmaker, pathlib; print(pathlib.Path(modelmaker.__file__).parent)')/static/index.html"
          modelmaker-demo demo
          test -f demo/projects/demo_pd_model/model.json
          test -f demo/sample_data/credit_risk_data.csv
