[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantology-modelmaker"
version = "0.1.0"
description = "Visual pipeline builder for financial model development"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Maurits Malkus", email = "10948172+mmalkus@users.noreply.github.com" },
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "polars>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "matplotlib>=3.8.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.11.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://www.quantology.nl/"
Repository = "https://github.com/mmalkus/Model-Maker"
Issues = "https://github.com/mmalkus/Model-Maker/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0", "textual>=0.80.0"]
anthropic = ["anthropic>=0.70.0"]
# Terminal UI. Pinned below 6 -- plotext 6.x restructured the package and
# dropped the top-level plot()/build()/save_fig() functions charts.py uses.
tui = ["textual>=0.80.0", "httpx>=0.27.0", "plotext>=5.2.0,<6"]

[project.scripts]
modelmaker-api = "modelmaker.api:main"
modelmaker-tui = "modelmaker.tui:main"

[tool.setuptools.packages.find]
include = ["modelmaker*"]

[tool.setuptools.package-data]
# Built frontend assets (frontend/`npm run build`, emitted here) -- optional,
# ships with the package when present so modelmaker-api can serve the UI.
modelmaker = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
