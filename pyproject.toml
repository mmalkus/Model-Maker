[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "modelmaker"
version = "0.1.0"
description = "Visual pipeline builder for financial model development"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "matplotlib>=3.8.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.11.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]
anthropic = ["anthropic>=0.70.0"]
# Terminal UI. Pinned below 6 -- plotext 6.x restructured the package and
# dropped the top-level plot()/build()/save_fig() functions charts.py uses.
tui = ["textual>=0.80.0", "httpx>=0.27.0", "plotext>=5.2.0,<6"]

[project.scripts]
modelmaker-api = "modelmaker.api:main"
modelmaker-tui = "modelmaker.tui.app:main"

[tool.setuptools.packages.find]
include = ["modelmaker*"]

[tool.setuptools.package-data]
# Built frontend assets (frontend/`npm run build`, emitted here) -- optional,
# ships with the package when present so modelmaker-api can serve the UI.
modelmaker = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
